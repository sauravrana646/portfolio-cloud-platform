# Values for charts/bootstrap-layer/argo-rollouts (nested under dependency name).
# Sourced from Client-Work/argo-rollouts bootstrap-components/dev-values.yaml
argo-rollouts:
  controller:
    replicas: 3
    resources:
      requests:
        cpu: 100m
        memory: 128Mi
      limits:
        cpu: 500m
        memory: 512Mi
    podAnnotations:
      newrelic.io/scrape: "true"
      prometheus.io/path: "/metrics"
      prometheus.io/port: "8090"
    metrics:
      # -- Deploy metrics service
      enabled: true
  dashboard:
    enabled: true
