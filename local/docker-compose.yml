# Local demo: pull the signed portfolio-secure-cicd release (digest-pinned).
# Run from repo root: docker compose -f local/docker-compose.yml up -d
# Or: make up
services:
  api:
    image: ${IMAGE_REF:-ghcr.io/sauravrana646/portfolio-secure-cicd@sha256:07e4bb93fa9734d2a2ef1dbfe942a447585c732907d9b9f5130f43787faf0f54}
    ports:
      - "8080:8080"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/healthz')",
        ]
      interval: 5s
      timeout: 3s
      retries: 5

  prometheus:
    image: prom/prometheus:v3.2.1
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"

  grafana:
    image: grafana/grafana:11.5.2
    ports:
      - "3000:3000"
    env_file:
      - path: .env
        required: false
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GF_SECURITY_ADMIN_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
    depends_on:
      - prometheus
