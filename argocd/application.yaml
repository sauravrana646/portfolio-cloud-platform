# Legacy single Application for quick local demos.
# Prefer argocd/root.yaml (App-of-Apps) for the enterprise layout.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: demo-app
  namespace: argocd
spec:
  project: default
  sources:
    - repoURL: https://github.com/sauravrana646/portfolio-cloud-platform.git
      targetRevision: main
      ref: values
    - repoURL: https://github.com/sauravrana646/portfolio-cloud-platform.git
      targetRevision: main
      path: charts/demo-app
      helm:
        valueFiles:
          - $values/deploy/environments/dev/images.yaml
          - $values/deploy/environments/dev/values.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: demo
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
