# Generic App-of-Apps: discovers charts via app.yaml / apps/*.yaml.
# Add a chart under charts/{bootstrap-layer,applications}/ + matching
# helm-values/ path + discovery file → Application is created automatically.
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: charts
  namespace: argocd
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=default"]
  generators:
    # One Application per bootstrap chart (charts/bootstrap-layer/<chart>/app.yaml)
    - git:
        repoURL: https://github.com/sauravrana646/portfolio-cloud-platform.git
        revision: main
        files:
          - path: charts/bootstrap-layer/*/app.yaml
    # One Application per workload env (charts/applications/<chart>/apps/<env>.yaml)
    - git:
        repoURL: https://github.com/sauravrana646/portfolio-cloud-platform.git
        revision: main
        files:
          - path: charts/applications/*/apps/*.yaml
  template:
    metadata:
      name: "{{ .name }}"
      namespace: argocd
      annotations:
        argocd.argoproj.io/sync-wave: '{{ default "0" .syncWave }}'
      labels:
        app.kubernetes.io/managed-by: charts-applicationset
        platform.layer: "{{ .layer }}"
        platform.chart: "{{ .chart }}"
    spec:
      project: default
      destination:
        server: https://kubernetes.default.svc
        namespace: "{{ .namespace }}"
      syncPolicy:
        syncOptions:
          - CreateNamespace=true
  # Optional fields (source type, autosync, SSA, finalizer, teleport) patched in.
  templatePatch: |
    metadata:
      {{- if ne (toString (default "true" .finalizer)) "false" }}
      finalizers:
        - resources-finalizer.argocd.argoproj.io
      {{- end }}
    spec:
      {{- if eq (default "helm" .sourceType) "directory" }}
      source:
        repoURL: https://github.com/sauravrana646/portfolio-cloud-platform.git
        targetRevision: main
        path: "{{ .chartPath }}"
      {{- else }}
      sources:
        - repoURL: https://github.com/sauravrana646/portfolio-cloud-platform.git
          targetRevision: main
          ref: values
        - repoURL: https://github.com/sauravrana646/portfolio-cloud-platform.git
          targetRevision: main
          path: "{{ .chartPath }}"
          helm:
            releaseName: '{{ default .chart .releaseName }}'
            valueFiles:
              - $values/helm-values/{{ .valuesPath }}/values.yaml
              {{- if .env }}
              - $values/helm-values/{{ .valuesPath }}/environments/{{ .env }}/values.yaml
              {{- if eq (toString (default "false" .imagePin)) "true" }}
              - $values/helm-values/{{ .valuesPath }}/environments/{{ .env }}/images.yaml
              {{- end }}
              {{- end }}
      {{- end }}
      syncPolicy:
        {{- if ne (toString (default "true" .autoSync)) "false" }}
        automated:
          prune: {{ ne (toString (default "true" .prune)) "false" }}
          selfHeal: {{ ne (toString (default "true" .selfHeal)) "false" }}
        {{- end }}
        syncOptions:
          - CreateNamespace=true
          {{- if eq (toString (default "false" .serverSideApply)) "true" }}
          - ServerSideApply=true
          {{- end }}
      {{- if eq .chart "teleport-kube-agent" }}
      ignoreDifferences:
        - group: apps
          kind: StatefulSet
          jqPathExpressions:
            - '.spec.template.spec.containers[] | select(.name == "teleport").image'
      {{- end }}
