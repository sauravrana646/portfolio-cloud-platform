apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: demo-uat
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "10"
spec:
  project: default
  sources:
    - repoURL: https://github.com/sauravrana646/portfolio-cloud-platform.git
      targetRevision: main
      ref: values
    - repoURL: https://github.com/sauravrana646/portfolio-cloud-platform.git
      targetRevision: main
      path: charts/applications/demo-app
      helm:
        valueFiles:
          - $values/helm-values/applications/demo-app/values.yaml
          - $values/helm-values/applications/demo-app/values-staging.yaml
          - $values/helm-values/applications/demo-app/environments/uat/images.yaml
          - $values/helm-values/applications/demo-app/environments/uat/values.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: demo-uat
  syncPolicy:
    automated:
      prune: true
      selfHeal: false
    syncOptions:
      - CreateNamespace=true
