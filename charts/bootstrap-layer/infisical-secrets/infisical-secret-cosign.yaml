# Syncs Infisical /cosign secret "cosign-public-key" → K8s Secret
# platform-system/cosign-public-key (key cosign.pub) for Kyverno.
# Prerequisites:
# 1. Infisical Secrets Operator installed (Argo bootstrap-infisical-operator)
# 2. Machine identity allowed to read project devops-portfolio-x-k3-y path /cosign
# 3. Kubernetes auth configured on that identity OR replace with universalAuth
#    + credentials Secret (OrbStack: see docs/LOCAL_K8S_ORBSTACK.md)
#
# Replace IDENTITY_ID_FROM_INFISICAL before sync (or patch via CI/overlay).
apiVersion: secrets.infisical.com/v1alpha1
kind: InfisicalSecret
metadata:
  name: cosign-public-key
  namespace: platform-system
spec:
  hostAPI: https://app.infisical.com/api
  authentication:
    kubernetesAuth:
      identityId: IDENTITY_ID_FROM_INFISICAL
      autoCreateServiceAccountToken: true
      serviceAccountRef:
        name: infisical-cosign-sa
        namespace: platform-system
      secretsScope:
        projectSlug: devops-portfolio-x-k3-y
        envSlug: prod
        secretsPath: /cosign
        recursive: false
  managedKubeSecretReferences:
    - secretName: cosign-public-key
      secretNamespace: platform-system
      creationPolicy: Owner
      template:
        includeAllSecrets: false
        data:
          # Infisical secret name is cosign-public-key (hyphen → use index).
          # Kyverno verifyImages expects PEM under cosign.pub.
          cosign.pub: '{{ (index . "cosign-public-key").Value }}'
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: infisical-cosign-sa
  namespace: platform-system
