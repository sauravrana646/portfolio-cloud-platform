# Cost-aware / laptop-friendly defaults (raise replicas for prod EKS).
admissionController:
  replicas: 1
  rbac:
    clusterRole:
      extraResources:
        - apiGroups: [""]
          resources: ["secrets", "configmaps"]
          verbs: ["get", "list", "watch"]
backgroundController:
  replicas: 1
cleanupController:
  replicas: 1
reportsController:
  replicas: 1
features:
  policyExceptions:
    enabled: true
config:
  webhooks:
    # Exclude system namespaces from mutation/validation noise in demos.
    namespaceSelector:
      matchExpressions:
        - key: kubernetes.io/metadata.name
          operator: NotIn
          values:
            - kube-system
            - kyverno
            - argocd
            - infisical-system
