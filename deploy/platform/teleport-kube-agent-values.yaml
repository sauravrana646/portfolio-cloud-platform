# Teleport Kubernetes agent — JIT kubectl access (not AWS Identity Center / SSM).
# Requires an existing Teleport cluster (Teleport Cloud free/team OR self-hosted
# teleport-cluster). Join token must NOT be committed — create Secret first:
#
#   kubectl -n teleport create secret generic teleport-kube-agent-join-token \
#     --from-literal=auth-token='<token from tctl tokens add --type=kube>'
#
# Then set proxyAddr + kubeClusterName below (or overlay per env).

roles: kube

# REPLACE before sync — your Teleport proxy public addr (e.g. example.teleport.sh:443)
proxyAddr: REPLACE_TELEPORT_PROXY_ADDR

# REPLACE — name shown in `tsh kube ls`
kubeClusterName: portfolio-cloud-platform

# Read join token from pre-created Secret (do not put authToken in git).
joinTokenSecret:
  create: false
  name: teleport-kube-agent-join-token

highAvailability:
  replicaCount: 1
  podDisruptionBudget:
    enabled: false

resources:
  requests:
    cpu: 50m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 512Mi
